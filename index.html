<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CRM Privilege</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- SweetAlert2 สำหรับแจ้งเตือนแบบ Modern -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .gradient-gold { 
            background: linear-gradient(135deg, #D4AF37 0%, #AA771C 100%); 
        }
        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmerEffect 3s infinite;
        }
        @keyframes shimmerEffect {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body class="antialiased text-gray-800">

    <!-- Loading Overlay -->
    <div id="loader" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-12 h-12 border-4 border-gray-200 border-t-yellow-600 rounded-full animate-spin"></div>
        <p class="mt-4 text-gray-500 text-sm tracking-wide">กำลังเตรียมสิทธิพิเศษของคุณ...</p>
    </div>

    <!-- Header Section -->
    <div class="relative pb-10 bg-slate-900 rounded-b-3xl shadow-xl">
        <div class="px-6 pt-8 pb-8 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <img id="profileImage" src="https://via.placeholder.com/150" alt="Profile" class="w-16 h-16 rounded-full border-2 border-yellow-500 shadow-md hidden">
                <div>
                    <h2 id="displayName" class="text-white text-xl font-semibold">ผู้ใช้งาน</h2>
                    <p class="text-yellow-400 text-xs mt-1">อัปเดตข้อมูลล่าสุดเมื่อสักครู่</p>
                </div>
            </div>
        </div>
        
        <!-- Member Tier Card -->
        <div class="absolute -bottom-14 left-0 right-0 px-6">
            <div class="gradient-gold rounded-2xl p-5 shadow-lg text-white relative overflow-hidden transform transition hover:scale-[1.02] duration-300">
                <div class="absolute inset-0 shimmer"></div> <!-- Effect แสงพาดผ่านการ์ด -->
                <div class="relative z-10 flex justify-between items-center">
                    <div>
                        <p class="text-xs text-yellow-100 opacity-90 mb-1">สถานะสมาชิก</p>
                        <h3 id="userTier" class="text-xl font-bold tracking-wide">LOADING...</h3>
                        <!-- จุดจิตวิทยา: ทำให้ลูกค้ารู้สึกว่าการมีระดับนี้คือความคุ้มค่า -->
                        <p id="tierMessage" class="text-[10px] text-yellow-50 mt-1 bg-black/20 inline-block px-2 py-0.5 rounded-full">
                            กำลังโหลดข้อมูลสิทธิประโยชน์...
                        </p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-yellow-100 opacity-90 mb-1">คะแนนสะสม</p>
                        <h3 class="text-3xl font-bold"><span id="userPoints">0</span> <span class="text-sm font-normal">pts</span></h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="mt-20 px-6 pb-10">
        <div class="mb-6">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <h3 class="text-lg font-semibold text-gray-800">บริการสำหรับคุณ</h3>
                    <p class="text-xs text-gray-500 mt-1">ยกระดับประสบการณ์ด้วยสิทธิพิเศษที่คัดสรรมาเฉพาะ</p>
                </div>
            </div>
            
            <!-- Action Menus -->
            <div class="grid grid-cols-2 gap-4">
                <button onclick="showAlert('แคตตาล็อกรางวัล', 'ฟังก์ชันแลกของรางวัลกำลังจะเปิดให้บริการเร็วๆ นี้')" class="glass-card p-5 rounded-2xl flex flex-col items-center justify-center text-yellow-700 hover:bg-yellow-50 transition border border-yellow-100">
                    <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"></path></svg>
                    <span class="text-sm font-semibold">แลกรับสิทธิ์</span>
                </button>
                <button onclick="showAlert('จองที่ปรึกษา', 'เข้าสู่ระบบจองคิวรับคำปรึกษาส่วนตัว')" class="glass-card p-5 rounded-2xl flex flex-col items-center justify-center text-slate-700 hover:bg-slate-50 transition border border-slate-200">
                    <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span class="text-sm font-semibold">นัดหมาย</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // กำหนด URL ของ Google Apps Script ที่ Deploy เป็น Web App
        const GAS_WEBAPP_URL = "YOUR_GAS_WEBAPP_URL_HERE"; 
        
        async function initializeLiff() {
            try {
                await liff.init({ liffId: "YOUR_LIFF_ID_HERE" }); 
                
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    
                    // อัปเดต UI รูปโปรไฟล์
                    document.getElementById('profileImage').src = profile.pictureUrl;
                    document.getElementById('profileImage').classList.remove('hidden');
                    document.getElementById('displayName').innerText = profile.displayName;
                    
                    // ดึงข้อมูล CRM จากระบบหลังบ้าน (GAS)
                    fetchCRMData(profile.userId);
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error('LIFF Error:', err);
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อระบบ LINE ได้', 'error');
            }
        }

        async function fetchCRMData(userId) {
            try {
                const response = await fetch(GAS_WEBAPP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ userId: userId }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } // ป้องกันปัญหา CORS กับ GAS
                });
                
                const result = await response.json();
                
                if(result.status === 'success') {
                    // ปิด Loading
                    document.getElementById('loader').style.opacity = '0';
                    setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 500);

                    // อัปเดตข้อมูลบนหน้าจอ
                    document.getElementById('userTier').innerText = result.data.tier;
                    document.getElementById('userPoints').innerText = result.data.points.toLocaleString();
                    document.getElementById('tierMessage').innerText = result.data.tierMessage;
                }
            } catch (error) {
                console.error('Fetch Error:', error);
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถดึงข้อมูลสิทธิพิเศษได้', 'error');
            }
        }

        function showAlert(title, text) {
            Swal.fire({
                title: title,
                text: text,
                icon: 'info',
                confirmButtonColor: '#D4AF37',
                confirmButtonText: 'ตกลง'
            });
        }

        // เริ่มต้นการทำงานเมื่อโหลดหน้าเสร็จ
        window.onload = initializeLiff;
    </script>
</body>
</html>
