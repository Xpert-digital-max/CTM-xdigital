<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE OA Business Consultant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
        .hero-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .line-green { color: #00B900; }
        .bg-line-green { background-color: #00B900; }
        .hover-bg-line-green:hover { background-color: #009900; }
    </style>
</head>
<body class="antialiased text-gray-800">

    <!-- Hero Section (กระตุ้น Pain Point) -->
    <header class="hero-bg text-white pt-16 pb-20 px-6 rounded-b-[2.5rem] shadow-2xl relative overflow-hidden">
        <div class="relative z-10 max-w-md mx-auto text-center">
            <span class="inline-block py-1 px-3 rounded-full bg-white/20 text-xs font-semibold mb-4 backdrop-blur-sm">
                สำหรับเจ้าของธุรกิจ
            </span>
            <h1 class="text-3xl font-bold leading-snug mb-4">
                ธุรกิจคุณกำลัง <span class="text-red-400">เสียรายได้</span><br>เพราะใช้ LINE OA ไม่สุดอยู่หรือเปล่า?
            </h1>
            <p class="text-slate-300 text-sm mb-6">
                ยิงแอดแพงแต่ลูกค้าไม่กลับมาซื้อซ้ำ? ตอบแชทหลุด? ข้อมูลลูกค้ากระจัดกระจาย? ถึงเวลาเปลี่ยนแชทให้เป็นระบบทำเงินอัตโนมัติ
            </p>
        </div>
    </header>

    <!-- Form Section -->
    <main class="max-w-md mx-auto px-6 -mt-10 relative z-20 pb-12">
        <div class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
            <h2 class="text-lg font-bold text-slate-800 mb-1">จองคิวประเมินธุรกิจ <span class="line-green">ฟรี</span></h2>
            <p class="text-xs text-slate-500 mb-6">ปรึกษาและวางกลยุทธ์โดยผู้เชี่ยวชาญด้าน LINE OA & CRM</p>

            <form id="consultForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">ชื่อ-นามสกุล</label>
                    <input type="text" id="name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#00B900] transition text-sm" placeholder="ชื่อผู้ติดต่อ">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">ประเภทธุรกิจ</label>
                    <input type="text" id="businessType" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#00B900] transition text-sm" placeholder="เช่น คลินิก, ร้านอาหาร, อสังหาฯ">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">ปัญหาหลักที่เจอตอนนี้</label>
                    <select id="painPoint" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#00B900] transition text-sm bg-white">
                        <option value="" disabled selected>เลือกปัญหาที่คุณอยากแก้ด่วนที่สุด</option>
                        <option value="ยิงแอดแพง ลูกค้าไม่ซื้อซ้ำ">ยิงแอดแพง ลูกค้าไม่กลับมาซื้อซ้ำ</option>
                        <option value="แอดมินตอบแชทไม่ทัน หลุดจอง">แอดมินตอบแชทไม่ทัน ออเดอร์หลุด</option>
                        <option value="ไม่มีระบบเก็บข้อมูลลูกค้า (CRM)">ไม่มีระบบเก็บฐานข้อมูลลูกค้า (CRM)</option>
                        <option value="เปิดบัญชีไว้แต่ใช้ฟีเจอร์ไม่เป็น">เปิดบัญชีไว้แต่ใช้ฟีเจอร์ไม่เป็น</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">เบอร์โทรศัพท์ติดต่อ</label>
                    <input type="tel" id="phone" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#00B900] transition text-sm" placeholder="08X-XXX-XXXX">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-line-green hover-bg-line-green text-white font-bold py-3.5 rounded-xl shadow-lg shadow-green-500/30 transition duration-300 mt-2 flex justify-center items-center">
                    <span>ส่งข้อมูลเพื่อรับคำปรึกษา</span>
                </button>
            </form>
        </div>
    </main>

    <script>
        // *** นำ URL ที่ได้จาก GAS มาใส่ในบรรทัดนี้ ***
        const GAS_URL = "YOUR_GAS_WEBAPP_URL_HERE";

        document.getElementById('consultForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            
            // เปลี่ยนปุ่มเป็นสถานะกำลังโหลด
            submitBtn.innerHTML = '<svg class="animate-spin h-5 w-5 mr-3 text-white" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังส่งข้อมูล...';
            submitBtn.disabled = true;

            const formData = {
                name: document.getElementById('name').value,
                businessType: document.getElementById('businessType').value,
                painPoint: document.getElementById('painPoint').value,
                phone: document.getElementById('phone').value
            };

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(formData),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                const result = await response.json();

                if (result.status === 'success') {
                    Swal.fire({
                        icon: 'success',
                        title: 'ส่งข้อมูลเรียบร้อย',
                        text: 'ทีมงานผู้เชี่ยวชาญจะติดต่อกลับไปหาคุณโดยเร็วที่สุด',
                        confirmButtonColor: '#00B900'
                    }).then(() => {
                        document.getElementById('consultForm').reset();
                    });
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'เกิดข้อผิดพลาด',
                    text: 'ไม่สามารถส่งข้อมูลได้ กรุณาลองใหม่อีกครั้ง',
                    confirmButtonColor: '#d33'
                });
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
